name: rallysource
ado:
  org: MilesThurman
  project: CodvoMigration
  repo: RallySource
  intake_tag: agent
  parked_tag: "agent:parked"
  base_branch: dev
  branch_prefix: agent/
repo:
  install: npm ci
  commands:
    test: npm run test --workspace=apps/rallysource-api
    lint: npm run lint
    typecheck: npm run type-check --workspace=apps/rallysource-web --workspace=apps/rallysource-teams
    build: npm run build
  command_timeout_s: 1200
  env_template: null
policy:
  protected_paths:
    - "**/prisma/migrations/**"
    - "**/prisma/schema.prisma"
    - "infra/**"
    - "azure-pipelines*.yml"
    - "Dockerfile*"
    - ".env*"
    - "**/.env*"
    - ".husky/**"
    - "**/*.pem"
    - "**/*.key"
    - "sonar-project.properties"
    # Tooling config that verify executes as code (checked against the tree 2026-09-24).
    # Root-anchored so app source such as apps/*/src/config/app.config.ts stays writable.
    - "*.config.*"
    - "apps/*/*.config.*"
    - "packages/*/*.config.*"
    - "packages/eslint-config/**"
    - "**/tsconfig*.json"
    - "packages/tsconfig/**"
    - "turbo.json"
    - ".npmrc"
    - "**/.npmrc"
    - "**/nest-cli.json"
    # rc-style and .config/ tooling config (.prettierrc, .babelrc, .eslintrc.json, ...).
    - "**/.*rc"
    - "**/.*rc.*"
    - "**/.config/**"
    - "**/prettier.config.*"
  manifest_paths:
    - "**/package.json"
    - "package-lock.json"
    - "**/package-lock.json"
    - "**/npm-shrinkwrap.json"
  max_diff_lines: 600
limits:
  max_concurrent_items: 1
  max_verify_retries: 3
  max_pr_rounds: 3
  max_turns: {plan: 30, implement: 80, review: 30}
  max_item_tokens: 2000000
  max_daily_agent_turns: 400
  max_daily_tokens: 20000000
  run_window: null
  max_denials_per_session: 5
  stale_after_minutes: 120
auth:
  mode: subscription
laya:
  model: auto
  max_ece: 0.10
  default_threshold: 0.8
